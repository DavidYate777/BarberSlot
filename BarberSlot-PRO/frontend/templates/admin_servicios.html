<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Servicios | Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="/admin" class="logo">BARBER<span>SLOT</span></a>
        <div class="nav-links">
            <a href="/admin">Dashboard</a>
            <a href="/admin/barberos">Barberos</a>
            <a href="/admin/horarios">Horarios</a>
            <a href="/logout" class="nav-btn">Salir</a>
        </div>
    </div>
</nav>

<div class="dashboard-container">
    <div class="welcome-card" style="max-width: 800px;">
        <h2>Gestionar <span>Servicios</span></h2>
        <p>Actualiza el catálogo de cortes y tratamientos disponibles.</p>

        <form method="POST" class="admin-form">
            <div class="input-group">
                <label>Nombre del Servicio</label>
                <input type="text" name="nombre" placeholder="Ej. Corte Fade + Barba" required>
            </div>

            <div class="input-group">
                <label>Precio ($)</label>
                <input type="number" name="precio" placeholder="0.00" step="0.01" required>
            </div>

            <button class="btn-primary">AGREGAR AL CATÁLOGO</button>
        </form>

        <div style="margin-top: 40px; text-align: left;">
            <h3>Servicios Disponibles</h3>
            <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                {% for s in servicios %}
                <div class="barbero-item" style="border-left-color: var(--primary);">
                    <div>
                        <strong style="color: white; text-transform: uppercase;">{{ s[1] }}</strong>
                    </div>
                    <span style="color: var(--primary); font-family: 'Oswald'; font-size: 1.2rem;">${{ s[2] }}</span>
                </div>
                {% else %}
                <p style="grid-column: span 2;">No hay servicios registrados.</p>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

</body>
</html>
