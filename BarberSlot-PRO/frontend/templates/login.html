<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | BarberSlot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="auth-container">
        <a href="/" style="position: absolute; top: 30px; left: 30px; color: var(--text-gray); text-decoration: none; font-size: 0.8rem; letter-spacing: 1px;">← VOLVER AL INICIO</a>

        <form class="form-box" method="POST" action="/login">
            <h2 class="logo">BARBER<span>SLOT</span></h2>
            <h3>ACCESO CLIENTES</h3>

            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="tu@email.com" required>
            </div>
            
            <div class="input-group" style="margin-bottom: 10px;">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div style="text-align: right; margin-bottom: 30px;">
                <a href="#" style="font-size: 0.75rem; color: var(--primary); text-decoration: none;">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%;">ENTRAR AL CLUB</button>
            
            <div class="form-footer">
                <a href="/register">¿Eres nuevo? <strong>Crea una cuenta aquí</strong></a>
            </div>
        </form>
    </div>

</body>
</html>
