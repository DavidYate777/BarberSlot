<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Barberos | Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="/admin" class="logo">BARBER<span>SLOT</span></a>
        <div class="nav-links">
            <a href="/admin">Dashboard</a>
            <a href="/admin/servicios">Servicios</a>
            <a href="/logout" class="nav-btn">Salir</a>
        </div>
    </div>
</nav>

<div class="dashboard-container">
    <div class="welcome-card" style="max-width: 800px;">
        <h2>Gestionar <span>Barberos</span></h2>
        <p>Añade nuevos profesionales a tu equipo de trabajo.</p>

        <form method="POST" class="admin-form">
            <div class="input-group">
                <label>Nombre del Barbero</label>
                <input type="text" name="nombre" placeholder="Ej. Daniel López" required>
            </div>

            <div class="input-group">
                <label>Teléfono de Contacto</label>
                <input type="text" name="telefono" placeholder="Ej. 3001234567" required>
            </div>

            <button class="btn-primary">REGISTRAR BARBERO</button>
        </form>

        <div style="margin-top: 40px; text-align: left;">
            <h3>Equipo Actual</h3>
            <div style="margin-top: 20px;">
                {% for b in barberos %}
                <div class="barbero-item">
                    <div>
                        <strong style="color: white; font-size: 1.1rem;">{{ b[1] }}</strong>
                        <p style="font-size: 0.8rem; margin: 0;">ID: #00{{ b[0] }}</p>
                    </div>
                    <span style="color: var(--primary); font-family: 'Oswald';">{{ b[2] }}</span>
                </div>
                {% else %}
                <p>No hay barberos registrados.</p>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

</body>
</html>
