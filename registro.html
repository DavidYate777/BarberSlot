<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta — BarberSlot</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">Barber<span>Slot</span></a>

    <nav class="navbar">
      <a href="index.html">Inicio</a>
      <a href="login.html">Iniciar Sesion</a>
    </nav>
  </header>

  <main class="form-page">

    <div class="form-card">

      <div class="form-logo">BarberSlot</div>

      <p class="form-subtitle">
        Crea tu cuenta y agenda tu primera cita hoy
      </p>

      <div class="form-divider"></div>

      <div class="alert alert-success" id="success-msg" style="display:none;">
        Cuenta creada correctamente
      </div>

      <div class="alert alert-error" id="error-msg" style="display:none;"></div>

      <!-- FORMULARIO -->
      <form id="registroForm">

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">

          <div class="field">
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              placeholder="Juan"
              autocomplete="given-name"
              required
            >
          </div>

          <div class="field">
            <label for="apellido">Apellido</label>
            <input
              type="text"
              id="apellido"
              placeholder="Garcia"
              autocomplete="family-name"
              required
            >
          </div>

        </div>

        <div class="field">
          <label for="correo">Correo Electronico</label>

          <input
            type="email"
            id="correo"
            placeholder="juan@correo.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="telefono">Telefono</label>

          <input
            type="tel"
            id="telefono"
            placeholder="+57 300 000 0000"
            autocomplete="tel"
            required
          >
        </div>

        <div class="field">
          <label for="pass">Contrasena</label>

          <input
            type="password"
            id="pass"
            placeholder="Minimo 8 caracteres"
            autocomplete="new-password"
            required
          >
        </div>

        <div style="font-size:0.78rem; color:var(--white-dim); margin-bottom:1.4rem; line-height:1.6;">
          Al registrarte aceptas nuestros
          <a href="#" style="color:var(--gold);">
            Terminos de Servicio
          </a>
          y
          <a href="#" style="color:var(--gold);">
            Politica de Privacidad
          </a>.
        </div>

        <button type="submit" class="btn btn-gold btn-full">
          Crear Cuenta
        </button>

      </form>

      <div class="form-divider" style="margin-top:1.8rem;"></div>

      <p class="form-extra">
        Ya tienes cuenta?
        <a href="login.html">Iniciar sesion</a>
      </p>

    </div>

  </main>

  <script>

    const form = document.getElementById('registroForm');

    form.addEventListener('submit', function(e) {

      e.preventDefault();

      const nombre = document.getElementById('nombre').value;
      const apellido = document.getElementById('apellido').value;
      const correo = document.getElementById('correo').value;
      const telefono = document.getElementById('telefono').value;
      const pass = document.getElementById('pass').value;

      // Obtener usuarios guardados
      let usuarios = JSON.parse(
        localStorage.getItem('bs_usuarios')
      ) || [];

      // Verificar si el correo ya existe
      const existe = usuarios.find(
        usuario => usuario.correo === correo
      );

      if (existe) {

        alert('Este correo ya esta registrado');

        return;
      }

      // Crear usuario
      const usuario = {

        nombre,
        apellido,
        correo,
        telefono,
        pass,
        rol: 'cliente'
      };

      // Guardar usuario
      usuarios.push(usuario);

      localStorage.setItem(
        'bs_usuarios',
        JSON.stringify(usuarios)
      );

      alert('Registro exitoso');

      // Redireccion
      window.location.href = 'login.html';

    });

  </script>

</body>
</html>
