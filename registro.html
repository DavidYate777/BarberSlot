<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta — BarberSlot</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">Barber<span>Slot</span></a>
    <nav class="navbar">
      <a href="index.html">Inicio</a>
      <a href="login.html">Iniciar Sesion</a>
    </nav>
  </header>

  <main class="form-page">
    <div class="form-card">

      <div class="form-logo">BarberSlot</div>
      <p class="form-subtitle">Crea tu cuenta y agenda tu primera cita hoy</p>

      <div class="form-divider"></div>

      <div class="alert alert-success" id="success-msg" style="display:none;">
        Cuenta creada correctamente. Redirigiendo a tu panel...
      </div>
      <div class="alert alert-error" id="error-msg" style="display:none;"></div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Juan" autocomplete="given-name">
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" placeholder="Garcia" autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <label for="correo">Correo Electronico</label>
        <input type="email" id="correo" placeholder="juan@correo.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="telefono">Telefono</label>
        <input type="tel" id="telefono" placeholder="+57 300 000 0000" autocomplete="tel">
      </div>

      <div class="field">
        <label for="pass">Contrasena</label>
        <input type="password" id="pass" placeholder="Minimo 8 caracteres" autocomplete="new-password">
      </div>

      <div style="font-size: 0.78rem; color: var(--white-dim); margin-bottom: 1.4rem; line-height: 1.6;">
        Al registrarte aceptas nuestros
        <a href="#" style="color: var(--gold);">Terminos de Servicio</a>
        y
        <a href="#" style="color: var(--gold);">Politica de Privacidad</a>.
      </div>

      <button class="btn btn-gold btn-full" id="btn-registro">
        Crear Cuenta
      </button>

      <div class="form-divider" style="margin-top: 1.8rem;"></div>

      <p class="form-extra">
        Ya tienes cuenta?
        <a href="login.html">Iniciar sesion</a>
      </p>

    </div>
  </main>

  <script>
    document.getElementById('btn-registro').addEventListener('click', () => {
      const nombre   = document.getElementById('nombre').value.trim();
      const apellido = document.getElementById('apellido').value.trim();
      const correo   = document.getElementById('correo').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const pass     = document.getElementById('pass').value.trim();
      const errEl    = document.getElementById('error-msg');
      const okEl     = document.getElementById('success-msg');

      errEl.style.display = 'none';
      okEl.style.display  = 'none';

      if (!nombre || !apellido || !correo || !pass) {
        errEl.textContent = 'Por favor completa todos los campos requeridos.';
        errEl.style.display = 'block';
        return;
      }

      if (pass.length < 8) {
        errEl.textContent = 'La contrasena debe tener al menos 8 caracteres.';
        errEl.style.display = 'block';
        return;
      }

      // Guardar datos del usuario en localStorage
      const usuario = { nombre, apellido, correo, telefono, rol: 'cliente' };
      localStorage.setItem('bs_usuario', JSON.stringify(usuario));
      // Inicializar lista de citas vacia si no existe
      if (!localStorage.getItem('bs_citas')) {
        localStorage.setItem('bs_citas', JSON.stringify([]));
      }

      okEl.style.display = 'block';
      setTimeout(() => { window.location.href = 'cliente/dashboard.html'; }, 1500);
    });
  </script>

</body>
</html>
