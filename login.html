<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesion — BarberSlot</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">Barber<span>Slot</span></a>
    <nav class="navbar">
      <a href="index.html">Inicio</a>
      <a href="registro.html" class="btn-nav">Crear Cuenta</a>
    </nav>
  </header>

  <main class="form-page">
    <div class="form-card">

      <div class="form-logo">BarberSlot</div>
      <p class="form-subtitle">Accede a tu cuenta para gestionar tus citas</p>

      <div class="form-divider"></div>

      <!-- Demo alert -->
      <div class="alert alert-success" id="demo-msg" style="display:none;">
        Acceso demostrado. Redirigiendo al panel de cliente...
      </div>

      <div class="field">
        <label for="email">Correo Electronico</label>
        <input type="email" id="email" placeholder="nombre@correo.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Contrasena</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div style="margin-bottom: 1.6rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--white-dim);">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; font-weight:400; letter-spacing:0;">
          <input type="checkbox" id="remember" style="width:auto; padding:0; margin:0; accent-color:var(--gold);">
          Recordarme
        </label>
        <a href="#" style="color: var(--gold); font-size:0.8rem;">Olvide mi contrasena</a>
      </div>

      <button class="btn btn-gold btn-full" id="btn-login">
        Ingresar
      </button>

      <div class="form-divider" style="margin-top: 1.8rem;"></div>

      <p class="form-extra">
        Acceso rapido de demostracion:<br>
        <span style="margin-top: 12px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
          <a href="cliente/dashboard.html" class="btn btn-outline" style="padding: 8px 18px; font-size: 0.72rem;">
            Cliente
          </a>
          <a href="barbero/dashboard.html" class="btn btn-outline" style="padding: 8px 18px; font-size: 0.72rem;">
            Barbero
          </a>
          <a href="admin/dashboard.html" class="btn btn-outline" style="padding: 8px 18px; font-size: 0.72rem;">
            Admin
          </a>
        </span>
      </p>

      <div class="form-divider"></div>

      <p class="form-extra">
        No tienes cuenta?
        <a href="registro.html">Registrate gratis</a>
      </p>

    </div>
  </main>

  <script>
    document.getElementById('btn-login').addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value.trim();

      if (!email || !pass) {
        document.getElementById('demo-msg').className = 'alert alert-error';
        document.getElementById('demo-msg').textContent = 'Completa todos los campos para continuar.';
        document.getElementById('demo-msg').style.display = 'block';
        return;
      }

      document.getElementById('demo-msg').className = 'alert alert-success';
      document.getElementById('demo-msg').textContent = 'Credenciales correctas. Redirigiendo...';
      document.getElementById('demo-msg').style.display = 'block';

      setTimeout(() => { window.location.href = 'cliente/dashboard.html'; }, 1200);
    });
  </script>

</body>
</html>
