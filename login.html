<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Iniciar Sesion — BarberSlot
  </title>

  <link
    rel="stylesheet"
    href="static/style.css"
  >

</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <a href="index.html" class="logo">
      Barber<span>Slot</span>
    </a>

    <nav class="navbar">

      <a href="index.html">
        Inicio
      </a>

      <a href="registro.html" class="btn-nav">
        Crear Cuenta
      </a>

    </nav>

  </header>

  <!-- LOGIN -->
  <main class="form-page">

    <div class="form-card">

      <div class="form-logo">
        BarberSlot
      </div>

      <p class="form-subtitle">
        Accede a tu cuenta para gestionar tus citas
      </p>

      <div class="form-divider"></div>

      <!-- MENSAJES -->
      <div
        class="alert alert-success"
        id="demo-msg"
        style="display:none;"
      ></div>

      <!-- FORM -->
      <form id="loginForm">

        <!-- EMAIL -->
        <div class="field">

          <label for="email">
            Correo Electronico
          </label>

          <input
            type="email"
            id="email"
            placeholder="nombre@correo.com"
            autocomplete="email"
            required
          >

        </div>

        <!-- PASSWORD -->
        <div class="field">

          <label for="password">
            Contrasena
          </label>

          <input
            type="password"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >

        </div>

        <!-- OPTIONS -->
        <div
          style="
            margin-bottom:1.6rem;
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-size:0.8rem;
            color:var(--white-dim);
          "
        >

          <label
            style="
              display:flex;
              align-items:center;
              gap:8px;
              cursor:pointer;
            "
          >

            <input
              type="checkbox"
              id="remember"
              style="
                width:auto;
                padding:0;
                margin:0;
                accent-color:var(--gold);
              "
            >

            Recordarme

          </label>

          <a
            href="#"
            style="
              color:var(--gold);
              font-size:0.8rem;
            "
          >
            Olvide mi contrasena
          </a>

        </div>

        <!-- BUTTON -->
        <button
          type="submit"
          class="btn btn-gold btn-full"
        >
          Ingresar
        </button>

      </form>

      <!-- DIVIDER -->
      <div
        class="form-divider"
        style="margin-top:1.8rem;"
      ></div>

      <!-- DEMO -->
      <p class="form-extra">

        Acceso rapido de demostracion:

        <br>

        <span
          style="
            margin-top:12px;
            display:flex;
            gap:10px;
            justify-content:center;
            flex-wrap:wrap;
          "
        >

          <button
            class="btn btn-outline"
            style="
              padding:8px 18px;
              font-size:0.72rem;
            "
            onclick="loginDemo('cliente')"
          >
            Cliente
          </button>

          <button
            class="btn btn-outline"
            style="
              padding:8px 18px;
              font-size:0.72rem;
            "
            onclick="loginDemo('barbero')"
          >
            Barbero
          </button>

          <button
            class="btn btn-outline"
            style="
              padding:8px 18px;
              font-size:0.72rem;
            "
            onclick="loginDemo('admin')"
          >
            Admin
          </button>

        </span>

      </p>

      <div class="form-divider"></div>

      <!-- REGISTER -->
      <p class="form-extra">

        No tienes cuenta?

        <a href="registro.html">
          Registrate gratis
        </a>

      </p>

    </div>

  </main>

  <!-- SCRIPT -->
  <script>

    window.onload = function () {

      const msgEl =
        document.getElementById('demo-msg');

      // MENSAJES
      function showMsg(texto, tipo) {

        msgEl.className =
          'alert ' +
          (
            tipo === 'ok'
            ? 'alert-success'
            : 'alert-error'
          );

        msgEl.textContent = texto;

        msgEl.style.display = 'block';
      }

      // USUARIOS DEMO
      const demoUsers = {

        cliente: {

          nombre: 'Juan',

          apellido: 'Garcia',

          correo: 'juan@demo.com',

          telefono: '+57 300 000 0001',

          rol: 'cliente'
        },

        barbero: {

          nombre: 'Carlos',

          apellido: 'Rodriguez',

          correo: 'carlos@demo.com',

          telefono: '+57 300 000 0002',

          rol: 'barbero'
        },

        admin: {

          nombre: 'Admin',

          apellido: 'BarberSlot',

          correo: 'admin@demo.com',

          telefono: '+57 300 000 0003',

          rol: 'admin'
        }
      };

      // DESTINOS
      const destinos = {

        cliente: 'cliente/dashboard.html',

        barbero: 'barbero/dashboard.html',

        admin: 'admin/dashboard.html'
      };

      // LOGIN DEMO
      window.loginDemo = function(rol) {

        const usuario = demoUsers[rol];

        localStorage.setItem(
          'bs_sesion',
          JSON.stringify(usuario)
        );

        if (!localStorage.getItem('bs_citas')) {

          localStorage.setItem(
            'bs_citas',
            JSON.stringify([])
          );
        }

        showMsg(
          'Acceso como ' +
          usuario.nombre,
          'ok'
        );

        setTimeout(() => {

          window.location.href =
            destinos[rol];

        }, 1200);
      };

      // FORM
      const form =
        document.getElementById('loginForm');

      if (!form) {

        console.error(
          'No existe loginForm'
        );

        return;
      }

      // LOGIN
      form.addEventListener(
        'submit',
        function(e) {

          e.preventDefault();

          const email =
            document
            .getElementById('email')
            .value
            .trim();

          const password =
            document
            .getElementById('password')
            .value
            .trim();

          // USUARIOS
          const usuarios = JSON.parse(

            localStorage.getItem(
              'bs_usuarios'
            )

          ) || [];

          // BUSCAR USUARIO
          const usuario = usuarios.find(

            u =>

            u.correo === email &&

            u.pass === password
          );

          // VALIDACION
          if (!usuario) {

            showMsg(
              'Correo o contrasena incorrectos',
              'err'
            );

            return;
          }

          // GUARDAR SESION
          localStorage.setItem(

            'bs_sesion',

            JSON.stringify(usuario)
          );

          showMsg(
            'Bienvenido ' +
            usuario.nombre,
            'ok'
          );

          // REDIRECCION
          setTimeout(() => {

            window.location.href =

              destinos[usuario.rol] ||

              'cliente/dashboard.html';

          }, 1200);

        }
      );

    };

  </script>

</body>
</html>
